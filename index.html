<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d2a"><title>Усадьба · Кухня</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>Семейная ресторация</small><h1>УСАДЬБА</h1></div><span class="badge">2.0</span></header><section class="hero"><p>Кухонный учёт без лишних действий</p><h2>Что делаем?</h2><div class="grid"><button onclick="openWriteoff()">🗑️<b>Списание</b><span>за 20 секунд</span></button><button disabled>📦<b>Приёмка</b><span>следующий модуль</span></button><button disabled>🧾<b>Накладные</b><span>следующий модуль</span></button><button disabled>📊<b>Отчёты</b><span>следующий модуль</span></button></div></section><section id="form" class="card hidden"><div class="top"><h2>Новое списание</h2><button class="x" onclick="closeWriteoff()">×</button></div><label>Станция<select id="station"><option>Раздача</option><option>ХЦ</option><option>ГЦ</option><option>Пицца</option><option>Стаф</option><option>Хоспер</option><option>Мясной цех</option><option>Кондитерский</option><option>Терраса</option></select></label><label>Что списываем?<input id="item" placeholder="Например: семга"></label><div class="row"><label>Количество<input id="qty" inputmode="decimal" placeholder="1"></label><label>Ед.<select id="unit"><option>кг</option><option>г</option><option>шт</option><option>л</option></select></label></div><label>Причина<input id="reason" placeholder="Напишите причину"></label><label>PIN сотрудника<input id="pin" inputmode="numeric" maxlength="3" placeholder="•••"></label><button class="primary" onclick="save()">Списать</button><p id="msg"></p></section><section class="card"><div class="top"><h2>Последние списания</h2><button class="refresh" onclick="load()">↻</button></div><div id="list" class="empty">Пока списаний нет</div></section></main><script src="/app.js"></script></body></html>
